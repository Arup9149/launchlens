<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Magnifying glass rim -->
  <circle cx="50" cy="50" r="32" stroke="#0B1B33" stroke-width="6.5" fill="none"/>
  <!-- Handle -->
  <line x1="73" y1="73" x2="100" y2="100" stroke="#0B1B33" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Chart bars (light to deep blue) -->
  <rect x="32" y="58" width="9" height="16" rx="1.5" fill="#93C5FD"/>
  <rect x="44" y="46" width="9" height="28" rx="1.5" fill="#3B82F6"/>
  <rect x="56" y="34" width="9" height="40" rx="1.5" fill="#1D4ED8"/>
  <!-- Rising trend line with dots -->
  <polyline points="28,66 40,54 53,44 70,26" stroke="#0B1B33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="28" cy="66" r="3.2" fill="#0B1B33"/>
  <circle cx="40" cy="54" r="3.2" fill="#0B1B33"/>
  <circle cx="53" cy="44" r="3.2" fill="#0B1B33"/>
  <circle cx="70" cy="26" r="3.2" fill="#0B1B33"/>
</svg>
